[project]
name = "ipo-parser"
version = "0.1.0"
description = "Extracts pages, sections and tables (with page numbers) from DRHP/RHP PDFs"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pymupdf>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
